{% extends "auctions/layout.html" %}

{% block body %}
    <h2>Create New Listing</h2>

    <form action="{% url 'create_listing' %}" method="POST">
        {% csrf_token %}
        <div class="form-group mb-3">
            <label>Product Title</label>
            <input class="form-control" type="text" name="title" required>
        </div>
        <div class="form-group mb-3">
            <label>Description</label>
            <textarea class="form-control" name="description" required></textarea>
        </div>
        <div class="form-group mb-3">
            <label>Initial Price ($)</label>
            <input class="form-control" type="number" step="0.01" name="price" required>
        </div>
        <div class="form-group mb-3">
            <label>Image URL (Optional)</label>
            <input class="form-control" type="url" name="image_url">
        </div>
        <div class="form-group mb-3">
            <label>Category (Optional)</label>
            <select class="form-control" name="category">
                <option value="">Select a category</option>
                {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.category_name }}</option>
                {% endfor %}
            </select>
        </div>
        <button class="btn btn-primary" type="submit">Create Listing</button>
    </form>
{% endblock %}
